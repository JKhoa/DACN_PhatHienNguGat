  #   password: your_password
  #   stream_quality: main
  #   enabled: true

# ============================================
# HƯỚNG DẪN SỬ DỤNG
# ============================================
# 1. Bỏ comment (xóa dấu #) ở camera bạn muốn dùng
# 2. Thay đổi thông tin:
#    - name: Tên camera (tùy ý)
#    - ip: Địa chỉ IP camera
#    - username: Tên đăng nhập
#    - password: Mật khẩu
# 3. Lưu file
# 4. Chạy: python multi_camera_app.py --config cameras_real.yaml
#
# Hoặc dùng GUI:
# 1. python gui_app.py
# 2. Tab "📹 Multi-Camera"
# 3. Click "📁 Load Config"
# 4. Chọn file cameras_real.yaml
# 5. Click "▶️ Start All"
#
# ============================================
# TÌM IP CAMERA
# ============================================
# Cách 1: Dùng app camera (IMOU Life, Tapo, v.v.)
# Cách 2: Vào router xem danh sách thiết bị
# Cách 3: Dùng Advanced IP Scanner: https://www.advanced-ip-scanner.com/
# Cách 4: Dùng lệnh: arp -a (Windows) hoặc nmap (Linux)
#
# ============================================
# TEST CAMERA
# ============================================
# Test trước khi thêm nhiều camera:
# python test_ip_camera.py
