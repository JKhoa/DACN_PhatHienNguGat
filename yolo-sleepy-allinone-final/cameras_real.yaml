# Cấu hình Camera Thật
# Chỉnh sửa file này với thông tin camera của bạn

cameras:
  # ============================================
  # WEBCAM (USB Camera hoặc Laptop Camera)
  # ============================================
  - name: "Laptop Camera"
    type: webcam
    source: 0  # 0 = camera mặc định, 1 = camera thứ 2, 2 = camera thứ 3
    enabled: true

  # Nếu có USB camera khác, thêm:
  # - name: "USB Camera"
  #   type: webcam
  #   source: 1
  #   enabled: true

  # ============================================
  # IP CAMERA - IMOU (Ranger, Cruiser...)
  # ============================================
  # - name: "Phòng học 101 - IMOU"
  #   type: ip
  #   brand: imou
  #   ip: 192.168.1.100        # ← Thay bằng IP camera của bạn
  #   port: 554
  #   username: admin          # ← Thay bằng username của bạn
  #   password: your_password  # ← Thay bằng password của bạn
  #   stream_quality: main     # main = HD, sub = chất lượng thấp
  #   enabled: true

  # ============================================
  # IP CAMERA - Hikvision
  # ============================================
  # - name: "Phòng học 102 - Hikvision"
  #   type: ip
  #   brand: hikvision
  #   ip: 192.168.1.101
  #   port: 554
  #   username: admin
  #   password: your_password
  #   stream_quality: main
  #   enabled: true

  # ============================================
  # IP CAMERA - Dahua
  # ============================================
  # - name: "Hành lang - Dahua"
  #   type: ip
  #   brand: dahua
  #   ip: 192.168.1.102
